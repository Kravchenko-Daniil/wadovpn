server {
    listen 80;
    server_name pay.wadovpn.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pay.wadovpn.online;

    ssl_certificate     /etc/letsencrypt/live/pay.wadovpn.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.wadovpn.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/pay.access.log;
    error_log  /var/log/nginx/pay.error.log;

    # YooKassa webhook
    location = /yookassa/webhook {
        proxy_pass http://127.0.0.1:8081/yookassa/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Healthcheck (для ручной проверки)
    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
    }

    location / { return 404; }
}
